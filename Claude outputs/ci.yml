# Integración continua: en cada push y pull request se ejecutan las pruebas
# de las tres partes del sistema y una prueba de humo del sistema completo.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DB_HOST: 127.0.0.1
  TEST_DB_USER: root
  TEST_DB_PASS: root
  TEST_DB_NAME: oswa_inv_test

jobs:
  php:
    name: PHP · PHPUnit (unitarias y caracterización)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, curl
          coverage: none
          tools: composer
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress
      - name: Ejecutar pruebas
        run: vendor/bin/phpunit

  api:
    name: Python · pytest (API de productos)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: pytest

  frontend:
    name: React · tipos, pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos de TypeScript
        run: npm run tipos
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  sistema-completo:
    name: Docker · prueba de humo del sistema completo
    runs-on: ubuntu-latest
    needs: [php, api, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Construir y levantar todos los servicios
        # --wait espera a que la base, el sistema PHP y la API pasen sus verificaciones de salud.
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Esperar a que la puerta de entrada responda
        run: |
          for intento in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/index.php; then
              echo "Listo después de $intento intentos"; exit 0
            fi
            sleep 3
          done
          echo "La puerta de entrada no respondió a tiempo"; exit 1
      - name: Prueba de humo
        run: bash scripts/prueba-humo.sh http://localhost:8080
      - name: Registros de los servicios (si algo falló)
        if: failure()
        run: docker compose logs --no-color
      - name: Detener los servicios
        if: always()
        run: docker compose down -v
