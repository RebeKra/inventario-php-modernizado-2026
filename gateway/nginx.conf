# Puerta de entrada única (patrón strangler fig).
#
# Todo el tráfico entra por aquí y nginx decide quién lo atiende:
#   /productos/  → interfaz nueva en React (archivos estáticos)
#   /api/v2/     → API nueva en FastAPI
#   todo lo demás → sistema PHP original
#
# La sesión sigue viviendo en PHP: antes de llegar a lo nuevo, nginx pregunta
# a PHP (auth_request) si el usuario inició sesión y tiene permiso.

upstream sistema_php { server php-app:80; }
upstream api_productos { server api:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # --- Módulos migrados -------------------------------------------------

    location ^~ /api/v2/ {
        auth_request /_verificar_sesion;
        proxy_pass http://api_productos;
    }

    location ^~ /productos/ {
        auth_request /_verificar_sesion;
        error_page 401 = @iniciar_sesion;
        root /usr/share/nginx/html;
        try_files $uri /productos/index.html;
    }

    # Las páginas viejas de productos llevan a la interfaz nueva.
    location ~ ^/(product|add_product|edit_product)\.php$ {
        return 302 /productos/;
    }

    # --- Verificación de sesión ------------------------------------------

    location = /_verificar_sesion {
        internal;
        proxy_pass http://sistema_php/api_sesion.php;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
    }

    # El endpoint de verificación solo se usa internamente.
    location = /api_sesion.php {
        return 404;
    }

    location @iniciar_sesion {
        return 302 /index.php;
    }

    # --- Archivos que nunca deben publicarse (H-14) ------------------------
    # El sistema original vive en la raíz del sitio, así que el volcado de la
    # base (con los hashes de las contraseñas), las librerías internas y el
    # código de los módulos nuevos quedaban descargables.

    location ~ ^/(includes|src|tests|database|api|frontend|gateway|docs|vendor)/ {
        return 404;
    }

    location ~ \.(sql|md|json|lock|yml|yaml|xml|dist|ini|txt)$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # --- Sistema PHP original ----------------------------------------------

    location / {
        proxy_pass http://sistema_php;
    }
}
