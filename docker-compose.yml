services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oswa_inv
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: --sql-mode=""
    volumes:
      - ./oswa_inv.sql:/docker-entrypoint-initdb.d/01-oswa_inv.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 15

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASS: app
      DB_NAME: oswa_inv
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
